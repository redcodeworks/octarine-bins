name: Promote a tested binaries image
description: >-
  The promote steps, run inside the caller's `promote` job on main: retag the tested, signed `testing` image to `latest` (binaries_promote.py,
  no rebuild). The caller checks out the repository first.
inputs:
  name:
    description: Image name under ghcr.io/<owner>/ (octarine-bins)
    required: true
  dir:
    description: Build directory of the image (src), the tree promote compares
    required: true
  check:
    description: "'--check' makes it a dry run (the promotion PR's Promotable jobs): decide only, retag nothing"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set up Python and uv
      uses: ./.github/actions/setup-ci-python

    - name: Set up cosign
      uses: ./.github/actions/setup-tool
      with:
        tool: cosign

    - name: Retag testing to latest (or only check that it can be)
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        DIR: ${{ inputs.dir }}
        CHECK: ${{ inputs.check }}
      run: uv run --frozen --no-dev python -I .github/scripts/binaries_promote.py ${CHECK} "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}" "${DIR}"
