name: Set up the Python of the CI scripts
description: >-
  Installs uv (pinned) and caches uv's download cache and the uv-managed Python, keyed on uv.lock, so a run reuses the locked dependencies and Python 3.14 (.python-version)
  instead of downloading them. The scripts then run with `uv run --frozen --no-dev python -I .github/scripts/<name>.py`: nothing is resolved at run time. The caller checks
  out the repository first.
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
        enable-cache: true
        cache-dependency-glob: uv.lock
        cache-python: true
