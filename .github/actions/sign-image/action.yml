name: Sign a binaries image and move testing
description: >-
  The signing steps shared by the three images, run inside the caller's `sign` job (`environment: signing`: an environment secret does not reach a job inside a reusable
  workflow, so the job and its environment stay in the caller and only the steps are shared). Signs the pushed digest, verifies it with cosign.pub and only THEN moves
  `testing` to it, so nobody ever sees an unsigned `testing`. The caller checks out the repository first.
inputs:
  image:
    description: Registry image without a tag
    required: true
  version:
    description: Version tag
    required: true
  digest:
    description: Digest to sign
    required: true
  skipped:
    description: "true when the build was skipped (nothing to sign)"
    required: true
  key:
    description: The cosign private key (the caller passes secrets.SIGNING_SECRET)
    required: true
runs:
  using: composite
  steps:
    - name: Nothing to sign
      if: inputs.skipped == 'true'
      shell: bash
      run: |
        echo "Nothing built, nothing signed: testing already is the signed build of the same inputs (binaries-skip.sh)" | tee -a "${GITHUB_STEP_SUMMARY}"

    - name: Login to GitHub Container Registry
      if: inputs.skipped != 'true'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set up cosign
      if: inputs.skipped != 'true'
      uses: ./.github/actions/setup-tool
      with:
        tool: cosign

    - name: Sign, then move testing
      if: inputs.skipped != 'true'
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: false
        COSIGN_PRIVATE_KEY: ${{ inputs.key }}
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        DIGEST: ${{ inputs.digest }}
      run: |
        set -euo pipefail
        [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No pushed digest to sign"; exit 1; }
        # the old bundle format, as for the OS images (https://github.com/containers/container-libs/issues/388)
        .github/scripts/retry.sh cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
        .github/scripts/cosign-check.sh --key cosign.pub "${IMAGE}@${DIGEST}"
        # signed: now `testing` may point at it (a registry-side copy, the same digest)
        .github/scripts/retry.sh skopeo copy --all --preserve-digests "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:testing"
        .github/scripts/registry-settled.sh "${IMAGE}" testing "${DIGEST}"
        .github/scripts/cosign-check.sh --key cosign.pub "${IMAGE}:testing"
        echo "signed: ${IMAGE}:${VERSION} and :testing = ${DIGEST}"
        echo "Binaries image ${IMAGE##*/} ${VERSION}, signed and published as \`testing\` (digest \`${DIGEST}\`)" >> "${GITHUB_STEP_SUMMARY}"
