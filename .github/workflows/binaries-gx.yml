name: Binaries image (gx)
# Builds ghcr.io/redcodeworks/octarine-bins-gx, signs it and promotes it: the same as binaries.yml (read its header) for the image of gx/, which only the octarine-os
# gx image needs. No component yet: an empty skeleton (see CLAUDE.md). Only a change to gx/, the shared src/lib or src/builder.env, or the build files
# (binaries-inputs.sh gx) rebuilds it. By hand: `gh workflow run binaries-gx.yml --ref testing` rebuilds, `--ref main` promotes.
on:
  push:
    branches:
      - testing
      - main
  workflow_dispatch:

# one run per ref at a time, none cancelled: two runs never push `testing` out of order
concurrency:
  group: binaries-gx-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build the gx binaries image
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.image.outputs.published }}
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
      skipped: ${{ steps.image.outputs.skipped }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build, check and push the image
        id: image
        uses: ./.github/actions/build-image
        with:
          name: octarine-bins-gx
          dir: gx

  # signing is in this workflow, not in a shared one: the environment secret SIGNING_SECRET does not reach a job of a reusable workflow
  sign:
    name: Sign the gx binaries image and move testing
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.published == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: signing
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Sign, then move testing
        uses: ./.github/actions/sign-image
        with:
          image: ${{ needs.build.outputs.image }}
          version: ${{ needs.build.outputs.version }}
          digest: ${{ needs.build.outputs.digest }}
          skipped: ${{ needs.build.outputs.skipped }}
          key: ${{ secrets.SIGNING_SECRET }}

  # main: the testing image becomes latest (see binaries-promote.sh). Nothing else moves latest.
  promote:
    name: Promote the tested gx binaries image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Retag testing to latest
        uses: ./.github/actions/promote-image
        with:
          name: octarine-bins-gx
          dir: gx
