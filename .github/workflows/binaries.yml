name: Binaries image
# Builds ghcr.io/redcodeworks/octarine-bins (the base image, every octarine-os variant), signs it and promotes it. octarine-bins builds THREE independent images,
# each by its own caller workflow of the same shared actions (.github/actions/build-image, sign-image, promote-image): this one (src/), binaries-dx.yml (dx/) and
# binaries-gx.yml (gx/). ONE build per image: src/Containerfile is a multi-stage build with a stage per component (src/components.tsv: scx, extest and ghostty, all
# required) and an assemble stage; a component that cannot be built fails the whole build, nothing is pushed and `testing` stays where it was (atomic). octarine-os reads
# `latest` of its images; only the promote job below moves `latest`.
#
# On testing (every push, or a dispatch): `build` builds the image, checks its layout and pushes it under an immutable version tag (<date>-<short sha>);
# `sign` signs that digest and only THEN moves `testing` to it, so nobody ever sees an unsigned `testing`. A push whose build inputs (binaries-inputs.sh src) equal those of
# the commit the current `testing` image was built from, with a verifying image, builds nothing (binaries-skip.sh): both jobs still run and succeed, their steps are skipped
# (the ruleset needs the job names to report, so there is no `paths:` filter). A dispatch always builds. The build reads and (on testing) writes a layer cache in the separate
# package octarine-bins-cache; the cache only saves time, the layout check and the signature decide what is published.
#
# On main (the promotion of testing into main, or a dispatch): `promote` retags the tested, signed `testing` image to `latest` (binaries-promote.sh; no rebuild).
# It fails unless `testing` exists and verifies with cosign.pub. Main builds nothing: it promotes the image that was built, signed and approved on testing.
#
# Any other ref (a dispatch from a branch) builds for validation only and publishes nothing. To rebuild by hand: `gh workflow run binaries.yml --ref testing`; to promote
# by hand: `--ref main`.
on:
  push:
    branches:
      - testing
      - main
  workflow_dispatch:

# one run per ref at a time, none cancelled: two runs never push `testing` out of order
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build the binaries image
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.image.outputs.published }}
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
      skipped: ${{ steps.image.outputs.skipped }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build, check and push the image
        id: image
        uses: ./.github/actions/build-image
        with:
          name: octarine-bins
          dir: src

  # signing is in this workflow, not in a shared one: the environment secret SIGNING_SECRET does not reach a job of a reusable workflow
  sign:
    name: Sign the binaries image and move testing
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.published == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: signing
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Sign, then move testing
        uses: ./.github/actions/sign-image
        with:
          image: ${{ needs.build.outputs.image }}
          version: ${{ needs.build.outputs.version }}
          digest: ${{ needs.build.outputs.digest }}
          skipped: ${{ needs.build.outputs.skipped }}
          key: ${{ secrets.SIGNING_SECRET }}

  # main: the testing image becomes latest (see binaries-promote.sh). Nothing else moves latest.
  promote:
    name: Promote the tested binaries image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Retag testing to latest
        uses: ./.github/actions/promote-image
        with:
          name: octarine-bins
          dir: src
