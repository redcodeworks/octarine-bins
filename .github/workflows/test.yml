name: Test
# The run of a push is named after the commit; a dispatch with `ref` (the bump workflow tests a bump branch tip from the testing ref, see bump_checks.py) is named
# "Test of <sha>" so bump_checks.py finds it. A dispatch on a branch itself (no ref) still works.
run-name: ${{ inputs.ref && format('Test of {0}', inputs.ref) || github.event.head_commit.message || 'Test' }}

# The fast lane: every push to a branch other than main runs the quick checks (`test`) and a secret scan (`secrets`). The ruleset requires both on the pull requests into
# testing. A push to `testing` runs them too: that run is a result to look at, not a gate. No pull_request trigger: the push check run is reported on the commit, so the
# pull request sees it and nothing runs twice. The image build is binaries.yml (testing and main pushes). `zizmor` (the workflow audit, not a required check and not part of `test`)
# runs on every push and every week, not on a dispatch (the bump flow dispatches this workflow and reads `test` and `secrets` only); the weekly run runs nothing else.
on:
  push:
    branches-ignore:
      - main
  schedule:
    - cron: "0 6 * * 3"  # Wednesdays 06:00 UTC: only the zizmor job runs (new audits and advisories arrive without a change here)
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to test (default: the commit of the ref the run was started on)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  # a newer push to a branch replaces the older run of that ref; only the tip's result matters. A dispatched run is grouped by the commit it tests (inputs.ref),
  # so a push never cancels it and it never cancels a push run.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The tests are grouped by area, one directory per group under tests/ (the directory tree is the only list); `plan-tests` lists the groups and fails when a test file sits outside
  # one, and one job `tests (<group>)` runs each. `sanity` is the quick parse and the Justfile format. `test` is the ONE required check (and the job name bump_checks.py reads from
  # the dispatched run): it only reports whether the plan, `sanity` and every group job succeeded.
  plan-tests:
    name: plan-tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: List the test groups
        id: plan
        run: python3 -I .github/scripts/60-check/plan_tests.py

  # a parse of the shell scripts, Python files and workflow files, and the Justfile format
  sanity:
    name: sanity
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-ci-python

      - name: Sanity checks
        run: uv run --frozen python -I .github/scripts/60-check/sanity.py

      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Check Just format
        run: just check

  # one job per group (pytest through uv with the locked dependencies, fake registry, cosign and GitHub API, no network)
  tests:
    name: tests (${{ matrix.group }})
    if: github.event_name != 'schedule'
    needs: plan-tests
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan-tests.outputs.groups) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-ci-python

      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Run the tests of the group
        env:
          GROUP: ${{ matrix.group }}
        run: just test "${GROUP}"

  # The required check: succeeds only when every job above succeeded (a skipped or cancelled one fails it).
  test:
    name: test
    needs: [plan-tests, sanity, tests]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do [ "$r" = success ] || exit 1; done

  secrets:
    name: secrets
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install the pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "${RUNNER_TEMP}/${f}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${f}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${f}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      - name: Scan the full history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .

  # zizmor (https://github.com/zizmorcore/zizmor) audits .github/workflows and .github/actions for security problems: template injection, excessive permissions, credential
  # persistence (artipacked), unpinned actions, known-vulnerable actions and the like. NOT a required status check and `test` does not wait for it. The binary is a pinned release
  # verified by its sha256 (the way the gitleaks job does it); to move it, read the release and replace both lines. A finding that is fixed in the workflow is fixed; one that
  # cannot or should not be fixed gets a narrow, documented entry in .github/zizmor.yml (rule and file and line), never a disabled rule.
  zizmor:
    name: zizmor
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned zizmor
        env:
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          f="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "${RUNNER_TEMP}/${f}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${f}"
          echo "${ZIZMOR_SHA256}  ${RUNNER_TEMP}/${f}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/zizmor"
          tar -xzf "${RUNNER_TEMP}/${f}" -C "${RUNNER_TEMP}/zizmor"
          echo "${RUNNER_TEMP}/zizmor" >> "${GITHUB_PATH}"

      # exits non-zero on any finding; GH_TOKEN lets the online audits (known-vulnerable actions, impostor commits) ask the API
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --version && zizmor --no-progress --config .github/zizmor.yml .github
