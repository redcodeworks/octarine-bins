# Narrow ignores for zizmor (https://docs.zizmor.sh/configuration/), one per finding that cannot or should not be fixed, each with its reason.
# No rule is disabled wholesale; an ignore names a FILE, so a new finding of the same rule in another file fails the audit.
rules:
  # `uses: ./.github/actions/setup-tool`: zizmor suggests the `$/...` self-repository syntax. The local path resolves to the SAME commit as the workflow, which is the
  # property that matters here (severity: help).
  self-repository:
    ignore:
      - action.yml
      - binaries.yml
      - bump-pins.yml
      - test.yml
  # bump-pins.yml pushes a branch with git (the bump pull request): the persisted checkout credential of the default GITHUB_TOKEN IS the mechanism (permissions
  # contents: write for this job only), there is no other credential in the workflow.
  artipacked:
    ignore:
      - bump-pins.yml
  # The only write to $GITHUB_PATH: setup-tool adds its own pinned tool directory under $HOME to PATH (no input reaches the value).
  github-env:
    ignore:
      - action.yml
