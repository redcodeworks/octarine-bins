# Dependencies of the CI scripts and their tests (not a package). The versions are pinned with hashes in uv.lock; every workflow and recipe runs `uv run --frozen`, so nothing resolves at run time.
# The exact interpreter is .python-version (uv-managed, never the runner's system Python); requires-python is only the floor the lock is valid for.
# The weekly bump workflow proposes new locked versions (`uv lock --upgrade`, the `python-deps` kind) and a newer patch release of the interpreter (the `python` kind), each as its own pull request.
[project]
name = "octarine-bins-ci"
version = "0"
description = "CI scripts of octarine-bins"
requires-python = ">=3.14"
dependencies = [
    "githubkit",  # the GitHub API (it brings httpx and pydantic, which the scripts use directly as well)
    "packaging",  # version ordering
    "pyyaml",     # sanity.py parses the workflow files
]

[dependency-groups]
dev = ["pytest", "ruff"]  # ruff only formats (githooks/pre-commit); no lint rules, no CI check

[tool.uv]
package = false

[tool.ruff]
# Format only. Measured on the tree: p90 of lines is 115 characters, p95 151; 160 leaves the code alone and only wraps the few really long lines.
line-length = 160
